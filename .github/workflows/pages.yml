# Publishes the marketing site to GitHub Pages.
#
# Deliberately separate from release.yml (which decides the version and cuts the
# tag) and build.yml (which builds and signs the binaries): the site carries no
# version, so coupling it to a release would only mean the page cannot be fixed
# without cutting one.
#
# Requires Settings -> Pages -> Source: "GitHub Actions" once, by hand.
name: pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "frontend/src/design/**"
      - "frontend/src/utils/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      # The site imports frontend/src/design directly, so the checkout above is
      # the only source it needs — frontend's own node_modules is never installed.
      - run: npm ci
        working-directory: site

      - run: npm run build
        working-directory: site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - id: deploy
        uses: actions/deploy-pages@v4
