# Decides the next version from the commit messages and cuts the release.
#
# This workflow does not build anything. It creates the tag and the GitHub
# release with its notes; publishing that release triggers build.yml, which
# compiles both platforms, signs the update manifest and uploads the assets to
# it. The version therefore still lives only in the git tag — semantic-release
# works out what the tag should be, it does not write a version into a file.
#
# Conventional commits drive it, which is what this repo already writes:
#   fix: ...            -> patch (v1.0.0 -> v1.0.1)
#   feat: ...           -> minor (v1.0.0 -> v1.1.0)
#   BREAKING CHANGE:    -> major (v1.0.0 -> v2.0.0)   (in the commit body)
#   ci:/docs:/chore:    -> no release at all
name: release

on:
  push:
    branches:
      - master

# Never let two releases run at once: they would both try to tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # A GitHub App token, not GITHUB_TOKEN, and this is load-bearing rather
      # than a preference: a tag or release created with GITHUB_TOKEN does not
      # trigger other workflows, so build.yml would never fire and the release
      # would sit there with no binaries on it forever.
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      - name: Checkout
        uses: actions/checkout@v6
        with:
          # semantic-release reads the whole history to find the last release.
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install release dependencies
        run: npm install -g semantic-release @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/github

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: semantic-release
