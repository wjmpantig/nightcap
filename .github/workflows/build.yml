name: build

on:
  pull_request:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # the tag build creates a release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: gofmt
        run: |
          $bad = gofmt -l .
          if ($bad) { $bad; exit 1 }
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      # Before the tests: frontend/dist is gitignored, so //go:embed has nothing
      # to match until the frontend has been built once.
      # Tag builds stamp the tag into main.version; everything else stays "dev".
      - run: wails build -platform windows/amd64 -clean -ldflags "-X main.version=$env:VERSION"
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

      - run: go test ./...

      - uses: actions/upload-artifact@v4
        with:
          name: nightcap-exe
          path: build/bin/nightcap.exe

      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/nightcap.exe
          generate_release_notes: true
