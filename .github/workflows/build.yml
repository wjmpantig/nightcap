name: build

on:
  pull_request:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: gofmt
        run: |
          $bad = gofmt -l .
          if ($bad) { $bad; exit 1 }
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      # Before the tests: frontend/dist is gitignored, so //go:embed has nothing
      # to match until the frontend has been built once.
      # Tag builds stamp the tag into main.version; everything else stays "dev".
      - run: wails build -platform windows/amd64 -clean -ldflags "-X main.version=$env:VERSION"
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

      - run: go test ./...

      - uses: actions/upload-artifact@v4
        with:
          name: nightcap-exe
          path: build/bin/nightcap.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: gofmt
        run: |
          bad=$(gofmt -l .)
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      # Before the tests: frontend/dist is gitignored, so //go:embed has nothing
      # to match until the frontend has been built once.
      - run: wails build -platform darwin/universal -clean -ldflags "-X main.version=$VERSION"
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

      - run: go test ./...

      # A .app is a directory; ditto zips it the way Finder would, so the
      # bundle survives the trip intact.
      - run: ditto -c -k --keepParent build/bin/nightcap.app build/bin/nightcap-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: nightcap-macos
          path: build/bin/nightcap-macos.zip

  # One release step, after both builds, so the two jobs never race to create
  # the same release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            nightcap.exe
            nightcap-macos.zip
          generate_release_notes: true
